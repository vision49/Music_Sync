.github/workflows/build-apk.yml/name: Build Music Sync APK  on:   workflow_dispatch:   push:     branches:       - main  jobs:   build:     runs-on: ubuntu-latest      steps:       - name: Checkout repository         uses: actions/checkout@v4        - name: Setup Node.js         uses: actions/setup-node@v4         with:           node-version: 22        - name: Install dependencies         run: npm ci        - name: Sync Capacitor         run: npx cap sync android        - name: Setup Java         uses: actions/setup-java@v4         with:           distribution: temurin           java-version: 21        - name: Build debug APK         working-directory: android         run: chmod +x gradlew && ./gradlew assembleDebug        - name: Upload APK         uses: actions/upload-artifact@v4         with:           name: Music-Sync-APK           path: android/app/build/outputs/apk